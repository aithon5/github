name: Hola mundO
on:
  push:
  workflow_dispatch:
    inputs:
      saludo:
        type: choice
        options: [hola, Buenas, Que tal]
jobs:
  saludar:
  runs-on: ububtu-latest
  steps:
    -uses: acctions/checkout@v4
    -run: echo "hola ${{ github.actor }}, comit ${{ github.sha }}"
    -run: 'echo "elegiste: ${{ inputs.saludo }}"'
